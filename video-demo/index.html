<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Demo Mural NESP</title>
<meta name="description" content="Demonstração interativa do Mural de Vagas NESP no App Inatel: tarefa completa do aluno, do alerta à entrevista.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800;900&display=swap">
<style>
  :root {
    --azul: #126ae2; --azul-forte: #0a3f8f; --fundo: #f3f6fb; --sup: #ffffff;
    --texto: #0f1b2d; --texto2: #46536a; --mudo: #7a879c; --borda: #e4e9f1;
    --suave: rgba(18,106,226,.09); --sombra: 0 1px 2px rgba(15,27,45,.04), 0 10px 30px rgba(15,27,45,.07);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --fundo: #0b1120; --sup: #111827; --texto: #f1f5f9; --texto2: #cbd5e1; --mudo: #94a3b8;
      --borda: #1f2937; --suave: rgba(59,130,246,.16); --sombra: 0 10px 30px rgba(0,0,0,.35);
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { background: var(--fundo); color: var(--texto); font-family: Inter, system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  button { font: inherit; color: inherit; cursor: pointer; }

  .app { max-width: 1180px; margin: 0 auto; padding: 24px 16px 40px; display: grid; gap: 28px; grid-template-columns: minmax(0, auto) minmax(0, 1fr); align-items: start; }
  @media (max-width: 900px) { .app { grid-template-columns: minmax(0, 1fr); padding-top: 12px; gap: 18px; } }

  /* ---------- palco ---------- */
  .palco-col { display: flex; flex-direction: column; gap: 12px; align-items: center; position: sticky; top: 16px; }
  @media (max-width: 900px) { .palco-col { position: static; } }
  .palco { position: relative; height: min(78vh, 880px); aspect-ratio: 9 / 16; border-radius: 28px; overflow: hidden; background: #000; box-shadow: 0 30px 60px -20px rgba(10,30,70,.45); user-select: none; touch-action: manipulation; }
  @media (max-width: 900px) { .palco { height: auto; width: min(100%, 460px); } }
  .palco canvas { width: 100%; height: 100%; display: block; }
  .palco:fullscreen { border-radius: 0; height: 100vh; width: auto; margin: 0 auto; background: #000; }

  .play-grande { position: absolute; inset: 0; display: grid; place-items: center; background: linear-gradient(180deg, rgba(7,29,66,.05), rgba(7,29,66,.55)); border: 0; transition: opacity .25s; }
  .play-grande span { display: flex; align-items: center; gap: 12px; padding: 16px 26px 16px 20px; border-radius: 999px; background: #fff; color: var(--azul); font-weight: 800; font-size: 17px; box-shadow: 0 12px 30px rgba(0,0,0,.25); transition: transform .15s; }
  .play-grande:hover span { transform: scale(1.04); }
  .play-grande[hidden] { display: none; }

  .legenda { position: absolute; left: 6%; right: 6%; bottom: 3.2%; text-align: center; pointer-events: none; transition: opacity .2s; }
  .legenda p { display: inline; margin: 0; padding: .28em .55em; border-radius: .5em; background: rgba(7,18,40,.72); color: rgba(255,255,255,.55); font-weight: 700; font-size: clamp(12px, 1.9vh, 17px); line-height: 1.75; -webkit-box-decoration-break: clone; box-decoration-break: clone; backdrop-filter: blur(6px); }
  .legenda b { color: #fff; font-weight: 800; }
  .legenda b.agora { color: #9cc3ff; }
  .legenda.off { opacity: 0; }

  .flash { position: absolute; top: 14px; left: 50%; transform: translateX(-50%); padding: 8px 14px; border-radius: 999px; background: rgba(7,18,40,.75); color: #fff; font-size: 13px; font-weight: 700; opacity: 0; transition: opacity .2s; pointer-events: none; white-space: nowrap; }
  .flash.on { opacity: 1; }

  /* ---------- controles ---------- */
  .controles { width: 100%; max-width: 100%; background: var(--sup); border: 1px solid var(--borda); border-radius: 20px; padding: 10px 12px 12px; box-shadow: var(--sombra); }
  .palco-col .controles { width: calc(min(78vh, 880px) * 9 / 16); min-width: 340px; }
  @media (max-width: 900px) { .palco-col .controles { width: min(100%, 460px); min-width: 0; } }
  .linha { position: relative; height: 26px; cursor: pointer; touch-action: none; }
  .trilho { position: absolute; left: 0; right: 0; top: 11px; height: 4px; border-radius: 4px; background: var(--borda); overflow: hidden; }
  .cheio { position: absolute; left: 0; top: 0; bottom: 0; background: var(--azul); width: 0; }
  .marca { position: absolute; top: 8px; width: 2px; height: 10px; border-radius: 2px; background: var(--mudo); opacity: .5; transform: translateX(-1px); }
  .cabeca { position: absolute; top: 5px; width: 16px; height: 16px; margin-left: -8px; border-radius: 50%; background: var(--azul); box-shadow: 0 0 0 4px var(--suave); }
  .dica { position: absolute; bottom: 30px; transform: translateX(-50%); padding: 5px 9px; border-radius: 8px; background: var(--texto); color: var(--fundo); font-size: 11px; font-weight: 700; white-space: nowrap; pointer-events: none; opacity: 0; transition: opacity .12s; }
  .linha:hover .dica { opacity: 1; }
  .botoes { display: flex; align-items: center; gap: 4px; margin-top: 4px; }
  .btn { display: inline-grid; place-items: center; min-width: 40px; height: 40px; padding: 0 10px; border: 0; border-radius: 12px; background: transparent; color: var(--texto2); font-size: 13px; font-weight: 800; }
  .btn:hover { background: var(--suave); color: var(--azul); }
  .btn.ativo { color: var(--azul); }
  .btn:disabled { opacity: .35; cursor: not-allowed; background: transparent; }
  .btn.play { background: var(--azul); color: #fff; }
  .btn.play:hover { background: var(--azul-forte); color: #fff; }
  .btn svg { width: 20px; height: 20px; }
  .tempo { white-space: nowrap; margin: 0 6px; font-size: 12px; font-weight: 700; color: var(--mudo); font-variant-numeric: tabular-nums; }
  .espaco { flex: 1; }
  @media (max-width: 400px) { .btn { min-width: 34px; padding: 0 6px; } #bVolta, #bAvanca { display: none; } }

  /* ---------- painel ---------- */
  .painel { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
  .topo { display: flex; align-items: center; gap: 14px; }
  .topo svg { width: 96px; flex-shrink: 0; }
  .topo h1 { margin: 0; font-size: clamp(22px, 3vw, 30px); font-weight: 900; letter-spacing: -.02em; line-height: 1.1; }
  .topo p { margin: 4px 0 0; color: var(--mudo); font-size: 14px; font-weight: 600; }
  .estado { display: flex; align-items: center; gap: 8px; padding: 10px 14px; border-radius: 14px; font-size: 13px; font-weight: 600; background: rgba(217,119,6,.1); color: #b45309; }
  .estado.ok { background: rgba(18,161,80,.1); color: #12a150; }
  .estado i { width: 8px; height: 8px; border-radius: 50%; background: currentColor; flex-shrink: 0; }
  .cartao { background: var(--sup); border: 1px solid var(--borda); border-radius: 20px; box-shadow: var(--sombra); overflow: hidden; }
  .cartao h2 { margin: 0; padding: 16px 18px 10px; font-size: 15px; font-weight: 800; display: flex; justify-content: space-between; align-items: baseline; }
  .cartao h2 small { color: var(--mudo); font-size: 12px; font-weight: 600; }
  ol.caps { list-style: none; margin: 0; padding: 0 8px 8px; counter-reset: c; }
  .cap { position: relative; display: grid; grid-template-columns: 30px 1fr auto; gap: 10px; align-items: center; width: 100%; padding: 10px 10px; border: 0; border-radius: 14px; background: transparent; text-align: left; overflow: hidden; }
  .cap:hover { background: var(--suave); }
  .cap .n { display: grid; place-items: center; width: 30px; height: 30px; border-radius: 10px; background: var(--fundo); color: var(--mudo); font-size: 12px; font-weight: 800; }
  .cap .tit { font-size: 14px; font-weight: 800; color: var(--texto); }
  .cap .sub { display: block; margin-top: 2px; font-size: 11.5px; color: var(--mudo); font-family: ui-monospace, SFMono-Regular, Menlo, monospace; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .cap .tag { font-size: 11px; font-weight: 700; color: var(--azul); background: var(--suave); padding: 3px 8px; border-radius: 999px; white-space: nowrap; }
  .cap .t { font-size: 11px; color: var(--mudo); font-weight: 700; font-variant-numeric: tabular-nums; margin-left: 6px; }
  .cap .barra { position: absolute; left: 0; bottom: 0; height: 3px; background: var(--azul); width: 0; }
  .cap.ativo { background: var(--suave); }
  .cap.ativo .n { background: var(--azul); color: #fff; }
  .cap.feito .n { color: var(--azul); }
  .cap .dir { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
  @media (max-width: 520px) { .cap .tag { display: none; } }
  .atalhos { display: flex; flex-wrap: wrap; gap: 8px 14px; padding: 0 18px 16px; color: var(--mudo); font-size: 12px; font-weight: 600; }
  kbd { display: inline-block; min-width: 22px; padding: 2px 6px; border-radius: 6px; border: 1px solid var(--borda); border-bottom-width: 2px; background: var(--fundo); color: var(--texto2); font: 700 11px Inter, sans-serif; text-align: center; }

  body.render .painel, body.render .controles, body.render .play-grande, body.render .legenda, body.render .flash { display: none !important; }
  body.render { background: #000; }
  body.render .app { display: block; padding: 0; max-width: none; }
  body.render .palco { height: 100vh; border-radius: 0; box-shadow: none; }
</style>
</head>
<body>
<main class="app">
  <section class="palco-col" aria-label="Vídeo de demonstração">
    <div class="palco" id="palco">
      <canvas id="film" width="1080" height="1920" aria-label="Animação da demonstração do app"></canvas>
      <div class="legenda" id="legenda" aria-live="polite"><p></p></div>
      <div class="flash" id="flash"></div>
      <button class="play-grande" id="playGrande" aria-label="Assistir demonstração">
        <span><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13a1 1 0 0 0 1.5.86l10.5-6.5a1 1 0 0 0 0-1.72L9.5 4.64A1 1 0 0 0 8 5.5Z"/></svg>Assistir demonstração</span>
      </button>
    </div>

    <div class="controles" id="controles">
      <div class="linha" id="linha" role="slider" aria-label="Linha do tempo" tabindex="0" aria-valuemin="0">
        <div class="trilho"><div class="cheio" id="cheio"></div></div>
        <div id="marcas"></div>
        <div class="cabeca" id="cabeca"></div>
        <div class="dica" id="dica"></div>
      </div>
      <div class="botoes">
        <button class="btn play" id="bPlay" aria-label="Reproduzir (espaço)" title="Reproduzir / pausar (espaço)"></button>
        <button class="btn" id="bVolta" aria-label="Capítulo anterior" title="Capítulo anterior (↑)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 20 9 12l10-8v16ZM5 19V5"/></svg></button>
        <button class="btn" id="bAvanca" aria-label="Próximo capítulo" title="Próximo capítulo (↓)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m5 4 10 8-10 8V4ZM19 5v14"/></svg></button>
        <span class="tempo" id="tempo">0:00 / 0:00</span>
        <span class="espaco"></span>
        <button class="btn" id="bVel" title="Velocidade">1×</button>
        <button class="btn ativo" id="bCC" aria-pressed="true" title="Legendas (C)">CC</button>
        <button class="btn" id="bSom" title="Som (M)"></button>
        <button class="btn" id="bTela" aria-label="Tela cheia" title="Tela cheia (F)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3M21 8V5a2 2 0 0 0-2-2h-3M3 16v3a2 2 0 0 0 2 2h3M16 21h3a2 2 0 0 0 2-2v-3"/></svg></button>
      </div>
    </div>
  </section>

  <section class="painel">
    <header class="topo">
      <svg viewBox="100 150 390 116" aria-label="Inatel" role="img"><path id="logoPath" fill="#126ae2"/></svg>
      <div>
        <h1>Mural de Vagas NESP</h1>
        <p>Demonstração da tarefa completa • Persona Lucas Estagiário</p>
      </div>
    </header>
    <div class="estado" id="estado"><i></i><span>Carregando…</span></div>

    <div class="cartao">
      <h2>Capítulos <small>toque para ir à cena</small></h2>
      <ol class="caps" id="caps"></ol>
      <div class="atalhos">
        <span><kbd>Espaço</kbd> play</span>
        <span><kbd>←</kbd><kbd>→</kbd> 2 s</span>
        <span><kbd>,</kbd><kbd>.</kbd> quadro</span>
        <span><kbd>↑</kbd><kbd>↓</kbd> capítulo</span>
        <span><kbd>C</kbd> legenda</span>
        <span><kbd>F</kbd> tela cheia</span>
      </div>
    </div>
  </section>
</main>
<audio id="audio" preload="auto"></audio>
<script type="module" src="player.js"></script>
</body>
</html>
